<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hall Indie</title>
    <link rel="stylesheet" href="css\cadastro_style.css">
</head>
<body style="background-color: bisque;">
    <center><h1>O Hall dos Jogos Indies</h1></center>

    <hr>

    <h2>cadastro</h2>

    <form>
        <label for="campo_nome">nome de usuário:</label>
        <input id="campo_nome" type="text" placeholder="Digite seu nome de usuário aqui" required><br><br>

        <label for="campo_email">email:</label>
        <input id="campo_email" type="email" placeholder="Digite seu email aqui" required><br><br>

        <label for="campo_senha">senha:</label>
        <input id="campo_senha" type="password" placeholder="Digite sua senha aqui" required><br><br>

        <h2>Porque tens enteresse no blog?</h2>

        <input id="ler" type="radio" name="reason" value="review">
        <label for="ler">Desejo ler reviews</label><br><br>

        <input id="rec" type="radio" name="reason" value="recomendation">
        <label for="rec">Gosto de recomendações de jogos</label><br><br>

        <input id="none" type="radio" name="reason" value="other">
        <label for="none">Outro</label><br><br>

        <h2>quais desses jogos você gosta?</h2>

        <input type="checkbox" name="item1" value="tlou">
        <label for="item1">the last of us</label><br><br>

        <input type="checkbox" name="item2" value="zelda">
        <label for="item2">The legend of zelda ocarina of time</label><br><br>

        <input type="checkbox" name="item3" value="mario">
        <label for="item3">super mario odyssey</label><br><br>

        <input type="checkbox" name="item4" value="ct">
        <label for="item4">chrono trigger</label><br><br>

        <h2>escolha seu genero de jogo favorito</h2>

        <select name="genre" required>
            <option selected disabled value="">selecione um genero</option>
            <option value="action">ação</option>
            <option value="rpg">rpg</option>
            <option value="plataformer">plataforma</option>
            <option value="musou">musou</option>
            <option value="fps">FPS</option>
            <option value="moba">MOBA</option>
            <option value="rhythm">ritmo</option>
            <option value="puzzle">puzzle</option>
            <option value="another">outro</option>
        </select>

        <br><br>

        <h2>caso tenha colocado outro, digite seu genero favorito:</h2>

        <textarea rows="5" cols="20" placeholder="digite o genero"></textarea>

        <br><br>

        <input type="submit" value="enviar formulário"><br><br>


    </form><br>
    <hr><br>
    <div>
        <a href="home.html">Pagina inicial</a>
        <a href="weekly_review.html">Review da semana</a>
        <a href="review_backlog.html">Backlog de reviews</a>
        <a href="photos.html">Galeria de fotos</a>
    </div>
</body>
</html>
